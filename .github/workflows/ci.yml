name: CI
on:
  pull_request:
  push:
    branches: [main]

# Lab 3: a new push to the same PR cancels the checks still running for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npx eslint .
        working-directory: server
      - run: npm ci && npx eslint .
        working-directory: client

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run migrate
        working-directory: server
      - run: npx jest --runInBand --coverage
        working-directory: server
      # Lab 1: download the report from the run's Summary page.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: server/coverage/

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx vitest run
        working-directory: client
      - run: npm run build
        working-directory: client

  # Lab 2: a critical vulnerability in either package fails the pipeline.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=critical
        working-directory: server
      - run: npm audit --audit-level=critical
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow_test
      JWT_SECRET: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
