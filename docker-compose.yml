services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leaveflow
      POSTGRES_PASSWORD: leaveflow
      POSTGRES_DB: leaveflow
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://leaveflow:leaveflow@db:5432/leaveflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # Lab 2: browse the database at http://localhost:8081
  # (System: PostgreSQL, Server: db, User/Password/DB: leaveflow)
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  dbdata:
