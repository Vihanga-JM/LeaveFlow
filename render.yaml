# Render Blueprint — New → Blueprint → pick this repo, and Render creates all three.
# The API container migrates the database on every start (see server/Dockerfile),
# so no manual `npm run migrate` in the Render shell is needed.
databases:
  - name: leaveflow-db
    region: singapore        # nearest Render region to Colombo
    plan: free
    databaseName: leaveflow
    user: leaveflow

services:
  - type: web
    name: leaveflow-api-vihangajm   # becomes the public URL; must be unique on Render
    runtime: docker
    region: singapore
    plan: free               # spins down after ~15 idle minutes; first request cold-starts
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leaveflow-db
          property: connectionString   # the internal URL — private network, no TLS needed
      - key: JWT_SECRET
        generateValue: true            # prod never shares dev's secret
      - key: TRUST_PROXY
        value: "1"                     # fallback only; Render's X-Forwarded-For has rotating hops
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip        # Cloudflare (in front of Render) overwrites this with the real client IP
      - key: DEMO_USER_PASSWORD
        generateValue: true            # replaces the public seed password; read it in the dashboard (Environment tab)

  - type: web
    name: leaveflow-web-vihangajm
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:                  # order matters: /api first, then the SPA fallback
      - type: rewrite
        source: /api/*
        destination: https://leaveflow-api-vihangajm.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
